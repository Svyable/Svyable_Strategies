[project]
name = "svyable-engine"
version = "0.1.0"
description = "Svyable: vendor-agnostic daily cross-sectional alpha engine and agentic PM harness"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "websocket-client>=1.7", "requests>=2.31"]
ml = ["scikit-learn>=1.4"]
hrp = ["scipy>=1.11"]
gui = ["streamlit>=1.36", "matplotlib>=3.8", "plotly==5.24.1", "watchdog>=4.0"]
broker = ["tastytrade>=13,<14", "python-dotenv>=1.0"]
dev = ["pytest>=8.0"]
# Keep `all` explicit so `pip install -e .[all,dev]` does not rely on
# resolver support for recursive/self-referencing extras.
all = [
    "yfinance>=0.2.40",
    "websocket-client>=1.7",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "streamlit>=1.36",
    "matplotlib>=3.8",
    "plotly==5.24.1",
    "watchdog>=4.0",
    "tastytrade>=13,<14",
    "python-dotenv>=1.0",
]

[project.scripts]
svyable = "svyable.cli:main"
svyable-strategy-daily = "svyable.strategy_daily:main"
svyable-agent-pack = "svyable.agent_pm_harness:main"
svyable-agent-decide = "svyable.agent_decision_writer:main"
svyable-agent-guard = "svyable.agent_decision_guard:main"
svyable-agent-receipt = "svyable.agent_review_receipt:main"
svyable-agent-audit = "svyable.agent_review_audit:main"
svyable-agent-review-chain = "svyable.agent_review_chain:main"
svyable-registry-quality = "svyable.strategy_registry_quality:main"
svyable-alpha-family = "svyable.alpha_family_governance:main"
svyable-strategy-day = "svyable.strategy_lifecycle:main"
svyable-strategy-activate = "svyable.strategy_activate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["svyable*"]}