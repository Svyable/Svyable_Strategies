[project]
name = "svyable-engine"
version = "0.1.0"
description = "Svyable: vendor-agnostic daily cross-sectional alpha engine (NASDAQ long-only flagship)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.40", "websocket-client>=1.7", "requests>=2.31"]
ml = ["scikit-learn>=1.4"]
hrp = ["scipy>=1.11"]
all = ["yfinance>=0.2.40", "websocket-client>=1.7", "requests>=2.31",
       "scikit-learn>=1.4", "scipy>=1.11"]

[project.scripts]
svyable = "svyable.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["svyable*"]
