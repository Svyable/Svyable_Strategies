name: execution-policy-ci

on:
  pull_request:
    paths:
      - "engine/svyable/rebalancer.py"
      - "engine/svyable/ledger.py"
      - "engine/svyable/brokers.py"
      - "engine/svyable/tastytrade_sdk.py"
      - "engine/svyable/cli.py"
      - "engine/tests/test_rebalancer_execution_policy.py"
      - "engine/tests/test_ledger_execution_status.py"
      - "engine/tests/test_broker_safety.py"
      - "engine/tests/test_tastytrade_sdk_preflight.py"
      - ".github/workflows/execution-policy-ci.yml"
  push:
    branches: [main]
    paths:
      - "engine/svyable/rebalancer.py"
      - "engine/svyable/ledger.py"
      - "engine/svyable/brokers.py"
      - "engine/svyable/tastytrade_sdk.py"
      - "engine/svyable/cli.py"
      - "engine/tests/test_rebalancer_execution_policy.py"
      - "engine/tests/test_ledger_execution_status.py"
      - "engine/tests/test_broker_safety.py"
      - "engine/tests/test_tastytrade_sdk_preflight.py"
      - ".github/workflows/execution-policy-ci.yml"

permissions:
  contents: read

jobs:
  execution-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Tastytrade SDK safety
        run: python tests/test_tastytrade_sdk_preflight.py
      - name: Broker adapter safety
        run: python tests/test_broker_safety.py
      - name: Rebalancer execution policy
        run: python tests/test_rebalancer_execution_policy.py
      - name: Ledger execution status
        run: python tests/test_ledger_execution_status.py
