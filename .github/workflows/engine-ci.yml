name: engine-ci

on:
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"

concurrency:
  group: engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Golden weights are an exact regression contract, so CI must not let hash
  # randomization or BLAS thread scheduling become hidden inputs.
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  offline-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            engine/requirements.lock

      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt intentionally stays loose for local development.
          # CI constrains only the numeric/research core that can affect exact
          # golden weights. Dashboard/broker packages still resolve normally
          # because requirements.lock is not a complete application lock.
          grep -E '^(numpy|pandas|pyarrow|scikit-learn|scipy|joblib|threadpoolctl|python-dateutil|pytz|typing-extensions)==' requirements.lock > /tmp/svyable-ci-constraints.txt
          cat /tmp/svyable-ci-constraints.txt
          python -m pip install -r requirements.txt -c /tmp/svyable-ci-constraints.txt
          python - <<'PY'
          import numpy, pandas
          try:
              import sklearn
              sklearn_v = sklearn.__version__
          except Exception:
              sklearn_v = "not-installed"
          print(f"CI deps: numpy={numpy.__version__} pandas={pandas.__version__} sklearn={sklearn_v}")
          PY

      - name: Compile modules
        run: python -m compileall -q svyable

      - name: Golden weights and causality regression
        run: python tests/test_regression.py

      - name: Turbulence and regime regression
        run: python tests/test_turbulence.py

      - name: Risk control regression
        run: python tests/test_risk_controls.py

      - name: Factor library regression
        run: python tests/test_factor_library_enhancements.py

      - name: Strategy blend regression
        run: python tests/test_strategy_blend.py

      - name: Tastytrade adapter safety tests
        run: python tests/test_tastytrade_sdk_preflight.py

      - name: Execution artifact regression
        run: python tests/test_execution_artifacts.py

      - name: Strategy selection regression
        run: python tests/test_strategy_selection.py

      - name: Institutional alpha regression
        run: python tests/test_institutional_alpha.py

      - name: Dashboard ADV regression
        run: python tests/test_dashboard_adv_plan.py

      - name: Fill quality regression
        run: python tests/test_execution_quality.py

      - name: Delayed fill recovery regression
        run: python tests/test_execution_backfill.py

      - name: Core synthetic smoke
        run: python -m svyable.cli --out /tmp/svyable-ci smoke
