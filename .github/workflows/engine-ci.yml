name: engine-ci

on:
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  push:
    branches: [main]
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"

concurrency:
  group: engine-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  offline-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: engine

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: Install dashboard dependencies
        id: install-deps
        continue-on-error: true
        run: |
          set -o pipefail
          : > pip-install.log
          python -m pip install --upgrade pip 2>&1 | tee -a pip-install.log
          python -m pip install -r requirements.txt 2>&1 | tee -a pip-install.log
          python - <<'PY' 2>&1 | tee -a pip-install.log
          import numpy, pandas
          try:
              import sklearn
              sklearn_v = sklearn.__version__
          except Exception:
              sklearn_v = "not-installed"
          print(f"CI deps: numpy={numpy.__version__} pandas={pandas.__version__} sklearn={sklearn_v}")
          PY

      - name: Upload pip install log
        if: steps.install-deps.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pip-install-log
          path: engine/pip-install.log
          if-no-files-found: ignore

      - name: Stop after dependency install failure
        if: steps.install-deps.outcome == 'failure'
        run: exit 1

      - name: Compile modules
        run: python -m compileall -q svyable

      - name: Panel cache regression
        run: python tests/test_panel_cache.py

      - name: Golden weights and causality regression
        run: python tests/test_regression.py

      - name: Upload golden weights snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-weights-snapshot
          path: |
            engine/tests/golden_weights_human.md
            engine/tests/golden_weights.csv
          if-no-files-found: ignore

      - name: Turbulence and regime regression
        run: python tests/test_turbulence.py

      - name: Risk control regression
        run: python tests/test_risk_controls.py

      - name: Factor library regression
        run: |
          python tests/test_factor_library_enhancements.py
          python tests/test_factor_catalog_smoke.py

      - name: Strategy blend regression
        run: python tests/test_strategy_blend.py

      - name: SDK, broker, rebalancer, and ledger safety suite
        run: |
          python -m pytest \
            tests/test_tastytrade_sdk_preflight.py \
            tests/test_broker_safety.py \
            tests/test_rebalancer_execution_policy.py \
            tests/test_ledger_execution_status.py \
            tests/test_tastytrade_rest_boundary.py \
            tests/test_api_runtime_safety.py

      - name: Execution artifact regression
        run: python tests/test_execution_artifacts.py

      - name: Strategy selection regression
        run: python tests/test_strategy_selection.py

      - name: Agent PM review rail regressions
        run: |
          python tests/test_agent_decision_guard.py
          python tests/test_agent_review_receipt.py
          python tests/test_agent_review_audit.py

      - name: Institutional alpha regression
        run: python tests/test_institutional_alpha.py

      - name: Dashboard ADV regression
        run: python tests/test_dashboard_adv_plan.py

      - name: Fill quality regression
        run: python tests/test_execution_quality.py

      - name: Delayed fill recovery regression
        run: python tests/test_execution_backfill.py

      - name: Core synthetic smoke
        run: python -m svyable.cli --out /tmp/svyable-ci smoke
